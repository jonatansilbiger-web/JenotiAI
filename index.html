<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jenoti AI - Advanced Intelligence</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-color: #131314;
            --chat-bg: #1e1e20;
            --text-color: #e3e3e3;
            --accent-color: #a8b1ff;
            --input-bg: #282a2d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Centerpiece Greeting (Gemini Style) */
        #hero-container {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            width: 100%;
            max-width: 720px;
            padding: 0 20px;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        #hero-container h1 {
            font-size: 3rem;
            font-weight: 500;
            background: linear-gradient(45deg, #a8b1ff, #fca5a5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        #hero-container p {
            font-size: 1.2rem;
            color: #8e918f;
        }

        /* Main Chat Layout */
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            max-width: 720px;
            width: 100%;
            margin: 0 auto;
            margin-bottom: 110px; /* Space for floating input */
            scroll-behavior: smooth;
        }

        /* Smooth Entry Animation for Chat Bubbles */
        .message {
            max-width: 85%;
            padding: 12px 18px;
            border-radius: 18px;
            line-height: 1.6;
            font-size: 1rem;
            word-wrap: break-word;
            animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .user-message {
            background-color: var(--chat-bg);
            color: var(--text-color);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .bot-message {
            background-color: transparent;
            color: var(--text-color);
            align-self: flex-start;
            padding-left: 0; /* Clean left-aligned text */
        }

        /* Beautiful AI Output Formatting rules matching Gemini/ChatGPT UI */
        .bot-message strong {
            color: #fff;
            font-weight: 600;
        }
        .bot-message p {
            margin-bottom: 12px;
        }
        .bot-message p:last-child {
            margin-bottom: 0;
        }
        .bot-message code {
            font-family: 'Consolas', 'Courier New', monospace;
            background-color: #2a2b2d;
            color: #fca5a5;
            padding: 2px 6px;
            border-radius: 6px;
            font-size: 0.92em;
        }
        .bot-message pre {
            background-color: #2a2b2d;
            padding: 14px;
            border-radius: 10px;
            overflow-x: auto;
            margin: 12px 0;
            border: 1px solid #3c3d40;
        }
        .bot-message pre code {
            background-color: transparent;
            padding: 0;
            color: #e3e3e3;
        }
        .bot-message ul, .bot-message ol {
            margin-left: 22px;
            margin-bottom: 12px;
        }
        .bot-message li {
            margin-bottom: 4px;
        }

        .system-message {
            background-color: #3b2a2a;
            color: #fca5a5;
            align-self: center;
            font-size: 0.9rem;
            text-align: center;
            border-radius: 8px;
            border: 1px solid #7f1d1d;
        }

        /* Pulsing Gradient Gemini-style Typing Indicator */
        .typing-indicator {
            display: flex;
            gap: 6px;
            align-items: center;
            height: 24px;
            padding-left: 4px;
        }

        .typing-indicator span {
            width: 10px;
            height: 10px;
            background: linear-gradient(45deg, #a8b1ff, #fca5a5);
            border-radius: 50%;
            animation: geminiPulse 1.2s infinite ease-in-out;
        }

        .typing-indicator span:nth-child(2) { animation-delay: 0.15s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.3s; }

        @keyframes geminiPulse {
            0%, 100% { transform: scale(0.7); opacity: 0.3; }
            50% { transform: scale(1.2); opacity: 1; }
        }

        /* Floating Center Bottom Input Bar */
        #input-container {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, var(--bg-color) 30%);
            padding: 20px 20px 30px 20px;
            display: flex;
            justify-content: center;
        }

        .input-wrapper {
            max-width: 720px;
            width: 100%;
            display: flex;
            align-items: center;
            background-color: var(--input-bg);
            border-radius: 28px;
            padding: 6px 14px 6px 22px;
            transition: box-shadow 0.2s;
        }

        .input-wrapper:focus-within {
            box-shadow: 0 0 0 2px #444746;
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-color);
            resize: none;
            height: 24px;
            max-height: 150px;
            font-size: 1.05rem;
            outline: none;
            padding: 4px 0;
            display: flex;
            align-items: center;
        }

        textarea::placeholder {
            color: #8e918f;
        }

        button {
            background-color: transparent;
            color: var(--accent-color);
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: rgba(168, 177, 255, 0.1);
        }

        button:disabled {
            color: #444746;
            cursor: not-allowed;
            background-color: transparent;
        }
    </style>
</head>
<body>

    <div id="hero-container">
        <h1>Jenoti AI</h1>
        <p>How can I help you today?</p>
    </div>

    <div id="chat-container"></div>

    <div id="input-container">
        <div class="input-wrapper">
            <textarea id="user-input" placeholder="Ask Jenoti AI..."></textarea>
            <button id="send-btn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        // Real active key successfully applied below
        const API_KEY = "AQ.Ab8RN6KyI2ItXzlUiXcALQSAFOTNDVYdMjYj3_zOcrfWpWBXpQ"; 
        const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${API_KEY}`;

        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const heroContainer = document.getElementById('hero-container');

        // Automatically auto-grow input height based on text
        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight - 4) + 'px';
        });

        // Enter to send
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // Hide the center greeting instantly on first prompt
            if (heroContainer) {
                heroContainer.style.opacity = '0';
                setTimeout(() => heroContainer.remove(), 300);
            }

            if (API_KEY === "YOUR_GEMINI_API_KEY_HERE" || !API_KEY) {
                appendMessage("System: Please replace the API key string with a working credentials token.", 'system-message');
                userInput.value = '';
                userInput.style.height = '24px';
                return;
            }

            // Print user message block
            appendMessage(text, 'user-message');
            
            // Clear input box immediately
            userInput.value = '';
            userInput.style.height = '24px';
            setLoading(true);

            // Print the customized pulsing typing indicator
            const botMessageDiv = appendMessage(`
                <div class="typing-indicator">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            `, 'bot-message');

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: text }] }],
                        systemInstruction: {
                            parts: [{ text: "You are Jenoti AI, a highly intelligent AI capable of answering both simple and extremely complex questions clearly and accurately. Always refer to yourself as Jenoti AI." }]
                        }
                    })
                });

                const data = await response.json();
                
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const rawResponseText = data.candidates[0].content.parts[0].text;
                    
                    // Render clean markdown text formatting smoothly inside bubble container
                    if (window.marked) {
                        botMessageDiv.innerHTML = window.marked.parse(rawResponseText);
                    } else {
                        botMessageDiv.innerText = rawResponseText;
                    }
                } else {
                    botMessageDiv.innerText = "Error: System received an empty response.";
                }

            } catch (error) {
                console.error(error);
                botMessageDiv.innerText = "Error: Could not connect to Jenoti AI. Check your API key setup.";
            } finally {
                setLoading(false);
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }
        }

        function appendMessage(text, className) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${className}`;
            messageDiv.innerHTML = text;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return messageDiv;
        }

        function setLoading(isLoading) {
            userInput.disabled = isLoading;
            sendBtn.disabled = isLoading;
            if (!isLoading) {
                userInput.focus();
            }
        }
    </script>
</body>
</html>
