<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JenotiAI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom scrollbar adjustments */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0b0f19; }
        ::-webkit-scrollbar-thumb { background: #1f293d; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #374151; }
    </style>
</head>
<body class="bg-[#070a13] text-gray-100 font-sans h-screen flex flex-col m-0">

    <header class="border-b border-gray-900 bg-[#0d1222]/80 backdrop-blur-md px-6 py-4 flex justify-between items-center shrink-0">
        <div class="flex items-center space-x-3">
            <div class="h-8 w-8 rounded-lg bg-gradient-to-tr from-cyan-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-cyan-500/20">
                <span class="text-white font-bold text-sm">J</span>
            </div>
            <h1 class="text-xl font-semibold tracking-tight bg-gradient-to-r from-white to-gray-400 bg-clip-text text-transparent">JenotiAI</h1>
        </div>
        
        <div class="flex items-center space-x-2">
            <input type="password" id="apiKeyInput" placeholder="Enter Gemini API Key" 
                   class="bg-[#141b2f] border border-gray-800 rounded-lg px-3 py-1.5 text-xs focus:outline-none focus:border-cyan-500 transition w-52 text-gray-200">
            <button onclick="saveApiKey()" class="bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-medium px-3 py-1.5 rounded-lg transition shadow-md shadow-cyan-600/10">
                Save Key
            </button>
        </div>
    </header>

    <main id="chatWindow" class="flex-1 overflow-y-auto p-6 space-y-6 max-w-4xl w-full mx-auto">
        <div class="flex items-start space-x-4">
            <div class="h-8 w-8 rounded-lg bg-gradient-to-tr from-cyan-500 to-indigo-600 flex items-center justify-center shrink-0">
                <span class="text-white text-xs font-bold">AI</span>
            </div>
            <div class="bg-[#0e1424] border border-gray-900 rounded-2xl px-4 py-3 max-w-[85%] text-gray-300 shadow-sm">
                <p class="leading-relaxed">Welcome to <strong>JenotiAI</strong>. Simply provide your Gemini API key above to initiate processing configurations.</p>
            </div>
        </div>
    </main>

    <footer class="border-t border-gray-900 bg-[#090d1a] p-4 shrink-0">
        <div class="max-w-4xl mx-auto flex items-center space-x-3 bg-[#0e1424] border border-gray-800 rounded-xl px-4 py-2.5 focus-within:border-cyan-500/40 transition">
            <textarea id="userInput" placeholder="Ask JenotiAI something..." rows="1"
                      class="bg-transparent flex-1 resize-none focus:outline-none text-sm text-gray-200 placeholder-gray-500 h-6 max-h-32 leading-6"
                      onkeydown="handleKeyPress(event)"></textarea>
            <button onclick="sendMessage()" id="sendBtn" class="text-cyan-400 hover:text-cyan-300 p-1.5 rounded-lg hover:bg-[#161f36] transition disabled:opacity-30" disabled>
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5" />
                </svg>
            </button>
        </div>
    </footer>

    <script>
        let chatHistory = [];
        
        // Auto-extract validation keys on local load lifecycle
        window.onload = () => {
            const savedKey = localStorage.getItem('jenoti_key');
            if (savedKey) {
                document.getElementById('apiKeyInput').value = savedKey;
                document.getElementById('sendBtn').disabled = false;
            }
        };

        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if (key) {
                localStorage.setItem('jenoti_key', key);
                document.getElementById('sendBtn').disabled = false;
                alert('Key verified and stored locally.');
            } else {
                localStorage.removeItem('jenoti_key');
                document.getElementById('sendBtn').disabled = true;
                alert('Key configurations cleared.');
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        async function sendMessage() {
    const inputField = document.getElementById('userInput');
    const userText = inputField.value.trim();
    const apiKey = localStorage.getItem('jenoti_key');

    if (!userText || !apiKey) return;

    inputField.value = '';
    
    // 1. Append the user message first
    appendMessage('user', userText);

    chatHistory.push({
        role: 'user',
        parts: [{ text: userText }]
    });

    // 2. Add a tiny delay or ensure a unique timestamp for the AI bubble
    // This stops the ID from conflicting with the user's bubble ID
    await new Promise(resolve => setTimeout(resolve, 50)); 

    const thinkingId = appendMessage('model', '<span class="text-gray-500 italic animate-pulse">Processing...</span>');

    try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'x-goog-api-key': apiKey
            },
            body: JSON.stringify({ contents: chatHistory })
        });

        if (!response.ok) {
            const errData = await response.json();
            throw new Error(errData.error?.message || 'Server pipeline communication breakdown.');
        }

        const data = await response.json();
        const aiReply = data.candidates[0].content.parts[0].text;

        // 3. This will now correctly update ONLY the AI's bubble
        updateMessage(thinkingId, aiReply);

        chatHistory.push({
            role: 'model',
            parts: [{ text: aiReply }]
        });

    } catch (error) {
        console.error(error);
        updateMessage(thinkingId, `<span class="text-red-400 font-medium">Error: ${error.message}</span>`);
    }
}

        function appendMessage(sender, text) {
            const chatWindow = document.getElementById('chatWindow');
            const messageId = 'msg-' + Date.now();
            
            const msgRow = document.createElement('div');
            msgRow.className = `flex items-start space-x-4 ${sender === 'user' ? 'flex-row-reverse space-x-reverse' : ''}`;
            
            const avatar = document.createElement('div');
            avatar.className = `h-8 w-8 rounded-lg flex items-center justify-center shrink-0 font-bold text-xs ${
                sender === 'user' ? 'bg-gray-800 text-cyan-400 border border-gray-700' : 'bg-gradient-to-tr from-cyan-500 to-indigo-600 text-white'
            }`;
            avatar.innerText = sender === 'user' ? 'U' : 'AI';

            const bubble = document.createElement('div');
            bubble.id = messageId;
            bubble.className = `rounded-2xl px-4 py-3 max-w-[85%] leading-relaxed text-sm ${
                sender === 'user' ? 'bg-cyan-950/20 border border-cyan-900/40 text-cyan-100' : 'bg-[#0e1424] border border-gray-900 text-gray-200'
            }`;
            
            if (sender === 'user') {
                bubble.innerText = text;
            } else {
                bubble.innerHTML = text;
            }

            msgRow.appendChild(avatar);
            msgRow.appendChild(bubble);
            chatWindow.appendChild(msgRow);
            
            chatWindow.scrollTop = chatWindow.scrollHeight;
            return messageId;
        }

        function updateMessage(id, text) {
            const bubble = document.getElementById(id);
            if (bubble) {
                // Formatting clean paragraph block transformations
                bubble.innerHTML = text.replace(/\n/g, '<br>');
                const chatWindow = document.getElementById('chatWindow');
                chatWindow.scrollTop = chatWindow.scrollHeight;
            }
        }
    </script>
</body>
</html>
